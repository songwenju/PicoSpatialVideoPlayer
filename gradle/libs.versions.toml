[versions]
agp = "8.11.0"
kotlin = "2.1.21"
ksp = "2.1.21-1.0.26"
composeCompiler = "2.1.21"

## PICO
## SpatialSDK
spatialBOM = "6.1.9"


coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
lifecycleRuntimeKtx = "2.8.4"
activityCompose = "1.8.0"
androidx-lifecycle = "2.8.4"
runtimeLivedata = "1.7.4"
exoPlayerVersion = "1.4.1"
composeUi = "1.10.4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "composeUi" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "composeUi" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "composeUi" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "composeUi" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleRuntimeKtx" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose-android", version.ref = "androidx-lifecycle" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata", version.ref = "runtimeLivedata" }

## Spatial UI 配置依赖项
spatialBOM = { group = "com.pico.spatial", name = "bom", version.ref = "spatialBOM" }
spatialcore = { group = "com.pico.spatial.core", name = "core" }
spatialui-design = { group = "com.pico.spatial.ui", name = "design" }
spatialui-foundation = { group = "com.pico.spatial.ui", name = "foundation" }
spatial-tracking = { group = "com.pico.spatial.tracking", name = "tracking", version.ref = "spatialBOM" }
# ExoPlayer 配置依赖项
exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "exoPlayerVersion" }
exoPlayerCommon = { group = "androidx.media3", name = "media3-common", version.ref = "exoPlayerVersion" }
exoplayer-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "exoPlayerVersion" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
google-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }
